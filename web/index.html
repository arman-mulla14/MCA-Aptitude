<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="MCA Aptitude Assessment Portal">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="MCA Aptitude Portal">
  <!-- Website Favicon & App Icons -->
  <link rel="icon" type="image/png" sizes="32x32" href="favicon.png?v=2"/>
  <link rel="icon" type="image/png" sizes="16x16" href="favicon.png?v=2"/>
  <link rel="shortcut icon" type="image/x-icon" href="favicon.ico?v=2"/>
  <link rel="apple-touch-icon" sizes="180x180" href="icons/Icon-192.png?v=2"/>

  <title>MCA Aptitude Assessment</title>
  <link rel="manifest" href="manifest.json">

  <!-- Firebase JS SDK for Flutter Web -->
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>

  <!-- Assessment Security Engine JavaScript Bridge -->
  <script>
    var isAssessmentActive = false;
    var lastResizeTime = 0;

    // Prevent right click, copy, paste, select, and DevTools shortcuts during exam
    document.addEventListener('contextmenu', function(e) {
      if (isAssessmentActive) e.preventDefault();
    });
    document.addEventListener('copy', function(e) {
      if (isAssessmentActive) e.preventDefault();
    });
    document.addEventListener('cut', function(e) {
      if (isAssessmentActive) e.preventDefault();
    });
    document.addEventListener('selectstart', function(e) {
      if (isAssessmentActive) e.preventDefault();
    });
    document.addEventListener('keydown', function(e) {
      if (!isAssessmentActive) return;
      // Block F12, Ctrl+Shift+I, Ctrl+Shift+J, Ctrl+U, Alt+Tab, Ctrl+Tab
      if (e.key === 'F12' || 
          (e.ctrlKey && e.shiftKey && (e.key === 'I' || e.key === 'J' || e.key === 'i' || e.key === 'j')) ||
          (e.ctrlKey && (e.key === 'U' || e.key === 'u')) ||
          (e.altKey && e.key === 'Tab')) {
        e.preventDefault();
        notifyViolation('SECURITY_KEY_PRESSED', 'Shortcut ' + e.key + ' blocked');
      }
    });

    function beforeUnloadHandler(e) {
      if (isAssessmentActive) {
        e.preventDefault();
        e.returnValue = 'Leaving the assessment will submit or terminate your test.';
        return e.returnValue;
      }
    }

    function notifyViolation(eventType, details) {
      if (!isAssessmentActive) return;
      if (window.onAssessmentSecurityViolation) {
        window.onAssessmentSecurityViolation(eventType, details || '');
      }
    }

    // Visibility / Tab Change Detection (Rule 1 & Rule 5)
    document.addEventListener('visibilitychange', function() {
      if (!isAssessmentActive) return;
      if (document.visibilityState === 'hidden') {
        notifyViolation('NEW_TAB', 'Tab switched or window hidden');
      } else if (document.visibilityState === 'visible') {
        notifyViolation('WINDOW_FOCUS_LOST', 'Window returned to focus');
      }
    });

    // Window Blur / Focus Loss Detection (Rule 5 & Rule 16)
    window.addEventListener('blur', function() {
      if (!isAssessmentActive) return;
      notifyViolation('WINDOW_BLUR', 'Window lost focus or minimized');
    });

    // Fullscreen Change Detection (Rule 6)
    document.addEventListener('fullscreenchange', function() {
      if (!isAssessmentActive) return;
      if (!document.fullscreenElement) {
        notifyViolation('FULLSCREEN_EXIT', 'User exited fullscreen mode');
      }
    });

    // Viewport Resize & Split Screen Detection (Rule 16)
    window.addEventListener('resize', function() {
      if (!isAssessmentActive) return;
      var now = Date.now();
      if (now - lastResizeTime < 1000) return; // Debounce 1 sec
      lastResizeTime = now;

      var w = window.innerWidth;
      var h = window.innerHeight;

      if (w < 720 || h < 480) {
        notifyViolation('SMALL_VIEWPORT', 'Viewport too small (' + w + 'x' + h + ')');
      } else {
        notifyViolation('WINDOW_RESIZED', 'Window resized to ' + w + 'x' + h);
      }
    });

    // Browser Back Button Trap (Rule 2)
    window.addEventListener('popstate', function(e) {
      if (!isAssessmentActive) return;
      history.pushState(null, null, location.href);
      notifyViolation('BACK_BUTTON', 'Browser Back button pressed');
    });

    // Global Functions called from Flutter
    window.enableAssessmentSecurity = function() {
      isAssessmentActive = true;
      window.addEventListener('beforeunload', beforeUnloadHandler);
      history.pushState(null, null, location.href);
    };

    window.disableAssessmentSecurity = function() {
      isAssessmentActive = false;
      window.removeEventListener('beforeunload', beforeUnloadHandler);
    };

    window.requestHTMLFullscreen = function() {
      try {
        var el = document.documentElement;
        if (el.requestFullscreen) {
          el.requestFullscreen();
        } else if (el.mozRequestFullScreen) {
          el.mozRequestFullScreen();
        } else if (el.webkitRequestFullscreen) {
          el.webkitRequestFullscreen();
        } else if (el.msRequestFullscreen) {
          el.msRequestFullscreen();
        }
      } catch (err) {
        console.warn('Fullscreen request failed:', err);
      }
    };

    window.exitHTMLFullscreen = function() {
      try {
        if (document.exitFullscreen) {
          document.exitFullscreen();
        } else if (document.webkitExitFullscreen) {
          document.webkitExitFullscreen();
        }
      } catch (err) {}
    };
  </script>
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
